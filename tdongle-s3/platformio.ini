; esp_slip_router — T-Dongle S3 (ESP32-S3) port
;
; A SLIP-to-WiFi NAT router that presents itself to a host (e.g. a DOS machine)
; as a USB CDC-ACM serial device. The host runs a SLIP packet driver over the
; COM port; this firmware NATs that traffic onto WiFi. lwIP on ESP32 has NAPT
; built in, so DNS "just works" — none of the ESP8266 liblwip surgery is needed.
;
; Platform: pioarduino espressif32 55.03.38 -> arduino-esp32 3.3.8 (IDF 5.x).
; That build ships lwIP with IP_FORWARD + IPV4_NAPT + NAPT_PORTMAP enabled
; (verified) but WITHOUT lwIP's slipif, so SLIP framing is implemented here.

[platformio]
default_envs = dos
boards_dir = boards

[env]
; pioarduino platform fork -> arduino-esp32 3.3.8 (IDF 5.x), the build whose
; bundled lwIP has IP_FORWARD + IPV4_NAPT + NAPT_PORTMAP enabled.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
framework = arduino
board = tdongle_s3
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; --- Router configuration (override here, or edit include/config.h) ---
    ; -DWIFI_SSID='"your-ssid"'
    ; -DWIFI_PASS='"your-pass"'
    ; --- Status display (0.96" 80x160 ST7735) ---
    ; Driven via Arduino_GFX. ST7735 pins/offsets/inversion come from LilyGO's
    ; factory init (esp_lcd_st7735): MOSI=3 SCLK=5 CS=4 DC=2 RST=1, BL=38
    ; (active LOW), gap (1,26), color inversion ON, BGR order.
    -DENABLE_DISPLAY=1

; -------- Deployment env: TinyUSB CDC-ACM (matches the CircuitPython USB stack
;          your DOS driver already speaks). Reflash needs manual download mode
;          (hold BOOT while plugging in). --------
[env:dos]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1

; -------- Development env: hardware USB-Serial/JTAG. Flashes without the button
;          dance and is fine for bring-up; same code, different USB personality. --------
[env:dev]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDEBUG_TO_USB=1

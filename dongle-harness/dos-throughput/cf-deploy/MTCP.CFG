PACKETINT 0x60
HOSTNAME bolo
IPADDR 192.168.240.2
NETMASK 255.255.255.0
GATEWAY 192.168.240.1
NAMESERVER 1.1.1.1
MTU 1500

# Generous buffer pool -- mTCP defaults are 8088-era and starve the receive
# path on a long-RTT SLIP+NAPT+WiFi+internet stack. With ~256B per packet
# slot + ~1500B per buffer, 32 packet buffers is ~50 KB of conventional
# memory -- fine on real DOS with XMS / UMB available.
PACKET_BUFFERS 32
TCP_BUFFERS 16

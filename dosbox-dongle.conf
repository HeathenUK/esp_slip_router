; DOSBox harness: T-Dongle S3 -> COM1 via macOS directserial; CF mounted as C:.
; Autoexec launches USBTERM.EXE so the dongle session is reproducible/screenshot-able.

[sdl]
fullscreen=false
output=opengl
autolock=false

[render]
aspect=true

[cpu]
core=auto
cputype=auto
cycles=max

[dos]
ems=false
xms=true
umb=true

[serial]
; Pipes the dongle's USB-CDC port straight to DOS COM1 (0x3F8).
; usbterm's BDA autodetect finds it as index 0 (COM1).
serial1=directserial realport:cu.usbmodemF412FA44AC4C1
serial2=disabled
serial3=disabled
serial4=disabled

[autoexec]
mount c /Volumes/95GD5428
c:
set path=c:\dos71;..;
prompt $P$G
echo === DOSBox dongle harness ===
usbterm > c:\result.txt
exit

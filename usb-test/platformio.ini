; Minimal USB serial smoke test for T-Dongle S3.
; Two envs, same minimal sketch, two different USB stacks:
;   hwcdc   -> ARDUINO_USB_MODE=1 (USB-Serial-JTAG, same hw block as ROM download)
;   tinyusb -> ARDUINO_USB_MODE=0 (TinyUSB CDC, what the main firmware uses)
[platformio]
default_envs = hwcdc
boards_dir = ../tdongle-s3/boards

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
framework = arduino
board = tdongle_s3
monitor_speed = 115200

[env:hwcdc]
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:tinyusb]
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
